[workspace]
authors = ["user"]
channels = ["conda-forge", "bioconda"]
name = "spatial_proteomics_pipeline"
platforms = ["linux-64"]
version = "0.1.0"

# four environments only:
#   default   - everything except Mesmer (image preparation, backsub, quantification, insitupy
#               alignment, plots, experiments.yml tooling)
#   spacec    - Mesmer segmentation (deepcell / tensorflow 2.8 need python <3.11 and numpy <2)
#   tacit     - TACIT cell type annotation (R only)
#   snakemake - the pipeline driver, kept small; runs outside the container (see run.sh)
[environments]
default = {features=["default"]}
spacec = {features=["spacec"], no-default-feature=true}
tacit = {features=["tacit"], no-default-feature=true}
snakemake = {features=["snakemake"], no-default-feature=true}

[tasks]
# create/update experiments.yml from the raw data directory, e.g.
#   pixi run update-experiments --config config/configs_codex/config.yml --dry-run
update-experiments = "python workflow/scripts/utils/update_experiments.py"

# default environment: former insitupy + backsub + squid_lazy_expl conda envs. Starting pins follow
# the working insitupy env (python 3.13); backsub needs zarr >=3, insitupy numpy >=2.1.3 and
# pyarrow <=21. Xenium data is read with read_xenium_sample (utils/xenium_readwrite.py, copied from
# analysis_repo), so spatialdata, spatialdata-io and muon follow analysis_repo's pins; these
# versions work with zarr 3, so the zarr-2 pin that squid_lazy_expl carried is gone
[dependencies]
python = "3.13.*"
numpy = ">=2.1.3,<3"
pandas = ">=2.3,<3"
scipy = ">=1.16"
tifffile = ">=2025.10"
imagecodecs = ">=2025.3"
zarr = ">=3.1,<4"
dask = ">=2025.3"
dask-image = ">=2024.5"
ome-types = ">=0.6"
loguru = "*"
psutil = "*"
scikit-image = ">=0.25,<1"
scikit-learn = ">=1.7"
geopandas = ">=1.1"
shapely = ">=2.1"
anndata = ">=0.11"
scanpy = ">=1.11,<2"
# Leiden clustering in preprocess_protein (TACIT plots)
python-igraph = "*"
spatialdata = ">=0.8.0,<0.9"
muon = ">=0.1.9,<0.2"
h5py = ">=3.16.0,<4"
matplotlib = ">=3.10"
seaborn = ">=0.13"
plotnine = ">=0.15"
affine = ">=2.4"
pyarrow = ">=14,<=21"
pyyaml = "*"
"ruamel.yaml" = "*"
squidpy = ">=1.6"
# exploratory notebooks (workflow/notebooks/)
ipykernel = ">=7.3.0,<8"

[pypi-dependencies]
insitupy-spatial = "==0.11.0b3"
backsub = "==0.5.1"
# from PyPI: the conda-forge build pulls readfcs from bioconda, which caps python <3.13
spatialdata-io = ">=0.7.0,<0.8"
# insitupy's image registration was validated with opencv 4.13; opencv 5 is untested
opencv-python = ">=4.8,<5"
pycomplexheatmap = "*"

# SPACEc pins python <3.11, matplotlib==3.9, cellpose==3.0.11 and torch<2.6, and deepcell pulls
# tensorflow 2.8, so it cannot share the default environment (copied from analysis_repo)
[feature.spacec]
platforms = ["linux-64"]

[feature.spacec.dependencies]
python = "3.10.*"
# SPACEc's own pins (cellpose 3.0.11, matplotlib 3.9, deepcell) are numpy 1.x only, so the conda
# side has to be held below 2 as well or the two solvers disagree
numpy = ">=1.26,<2.0"
# tifffile >=2025.5.10 rewrote its zarr store for zarr 3 and raises on zarr 2
tifffile = "<2025.5.10"
zarr = "<3"
pandas = "*"
tqdm = "*"
# system library behind pyvips, which SPACEc imports at load time through tissuumaps
libvips = "*"
# CUDA runtime of the tensorflow 2.8.4 pip wheel (built against CUDA 11.2 / cuDNN 8): without them
# tensorflow cannot load libcudart.so.11.0 / libcudnn.so.8 and Mesmer silently runs on CPU
cudatoolkit = "11.2.*"
cudnn = "8.1.*"

[feature.spacec.pypi-dependencies]
spacec = ">=0.1.2, <0.2"

# the pip tensorflow only searches LD_LIBRARY_PATH for the CUDA libraries, not the env's lib/; keep
# the existing path after it (apptainer --nv puts the host driver's libcuda there)
[feature.spacec.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

# TACIT (workflow/scripts/_cell_type_annotation/TACIT_function.R, vendored: the GitHub package does
# not install). These are the packages that file loads; leidenbase backs Seurat's Leiden clustering
[feature.tacit]
platforms = ["linux-64"]

[feature.tacit.dependencies]
r-base = "4.4.*"
r-seurat = ">=5.0.3"
r-leidenbase = "*"
r-segmented = "*"
r-ggplot2 = "*"
r-dplyr = "*"
r-rann = "*"
r-igraph = "*"
r-rpart = "*"
r-future = "*"
"r-future.apply" = "*"
r-parallelly = "*"
r-uwot = "*"
r-matrix = "*"
r-foreach = "*"
r-doparallel = "*"
r-caret = "*"
r-mclust = "*"
"r-data.table" = "*"
r-optparse = "*"

# only the env's own R library: ~/.Renviron (read in the container too, $HOME is bound) and the
# shell can point R at a personal library built for another R version
[feature.tacit.activation.env]
R_ENVIRON_USER = "/dev/null"
R_PROFILE_USER = "/dev/null"
R_LIBS_SITE = "$CONDA_PREFIX/lib/R/library"
R_LIBS_USER = "$CONDA_PREFIX/lib/R/library"

[feature.snakemake]
platforms = ["linux-64"]

[feature.snakemake.dependencies]
snakemake = "==9.20.0"
snakemake-executor-plugin-slurm = "*"
snakemake-executor-plugin-slurm-jobstep = "*"
snakemake-executor-plugin-cluster-generic = "*"
snakemake-interface-common = "*"
snakemake-interface-executor-plugins = "*"
snakemake-interface-report-plugins = "*"
snakemake-interface-storage-plugins = "*"
snakemake-logger-plugin-snkmt = "*"

[feature.snakemake.pypi-dependencies]
snkmt = "*"
