# Snakemake profile for SLURM clusters: every rule is submitted as one sbatch job (cluster-generic executor).
# Adapt the marked values to your cluster, or keep your own copy of this folder and pass it to run.sh
# with --profile <folder> (or set SNAKEMAKE_PROFILE).
executor: cluster-generic

# sbatch flags; partition, threads, memory, runtime and slurm_extra come from each rule's resources
# (defaults below). Add e.g. --account=<account> or --qos=<qos> here if your cluster requires them.
cluster-generic-submit-cmd:
  sbatch
    --partition={resources.partition}
    --cpus-per-task={threads}
    --job-name=smk-{rule}
    --parsable
    --output=log_files/smk_submission/smk.out
    --error=log_files/smk_submission/smk.err
    --mem={resources.mem_mb}
    --time={resources.runtime}
    {resources.slurm_extra}

# cancelling run.sh (Ctrl-C) cancels all jobs submitted by the pipeline
cluster-generic-cancel-cmd: scancel
cluster-generic-cancel-nargs: 1000
jobs: 500
retries: 0
max-jobs-per-second: 10
max-status-checks-per-second: 10
printshellcmds: True
keep-going: true
rerun-triggers: [mtime, params, code]
rerun-incomplete: true
sdm: apptainer
# every folder outside the repository that holds raw data, outputs, the container or models must be
# bound into the container: add one --bind <folder> per location (adapt to your cluster)
apptainer-args: "--nv --cleanenv --no-home --env RUST_BACKTRACE=full"
# the active dataset config (see config/README.md); override with --configfile
configfile: config/config.yml
logger: snkmt
# run.sh overrides this with {output_path}/snkmt.db of the active config
logger-snkmt-db: log_files/snkmt.db
latency-wait: 120
use-singularity: true


default-resources:
  partition: cpu  # adapt: your cluster's CPU partition
  threads: 1
  mem_mb: 5120
  runtime: 240
  slurm_extra: "" # needed for GPU jobs
